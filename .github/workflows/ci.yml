name: CI - Seguridad, Calidad Estática y Pruebas

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  security-and-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated security and unit tests (pytest)
        run: pytest -v

      - name: Run SAST vulnerability scan (bandit)
        run: bandit -r task_api

      - name: Run static code quality analysis (pylint)
        run: pylint task_api
