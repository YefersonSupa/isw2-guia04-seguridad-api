[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"

[tool.pylint.main]
py-version = "3.11"
ignore = ["capturas", "evidencias", "informe", "__pycache__"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-args = 7
max-positional-arguments = 7
max-attributes = 10

[tool.bandit]
exclude_dirs = ["tests", "scripts", "capturas", "evidencias", "informe"]

